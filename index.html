<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habesha iTunes Music Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#eab308', // Gold accent
            darkBg: '#0d0e12',
            cardBg: '#16181e',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen antialiased selection:bg-brand selection:text-black">

  <!-- TOP NAVIGATION BAR -->
  <header class="sticky top-0 z-50 bg-darkBg/90 backdrop-blur-md border-b border-gray-800/80 px-4 lg:px-8 py-3 flex items-center justify-between gap-4">
    <!-- Logo -->
    <a href="#" onclick="loadFilterData('all-time')" class="flex items-center gap-2 text-xl font-bold tracking-tight text-white">
      <span class="bg-brand text-black font-black px-2 py-0.5 rounded text-lg">H</span>
      <span>Habesha<span class="text-brand">Tracker</span></span>
    </a>

    <!-- Live Search Bar -->
    <div class="flex-1 max-w-xl mx-2">
      <form id="search-form" class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input 
          id="search-input"
          type="text" 
          placeholder="Search Ethiopian artists, songs, or albums..." 
          class="w-full bg-cardBg text-sm text-gray-200 placeholder-gray-500 rounded-full pl-10 pr-4 py-2 border border-gray-800 focus:outline-none focus:border-brand transition-colors"
        />
      </form>
    </div>

    <!-- 1. Google Sheets Tab Navigation Pills -->
    <nav class="hidden lg:flex items-center gap-1 bg-cardBg p-1 rounded-full border border-gray-800 text-xs font-medium" id="category-pills">
      <button data-tab="all-time" class="pill-btn active px-3 py-1.5 rounded-full bg-brand text-black font-semibold shadow-sm transition">All-Time Tracks</button>
      <button data-tab="weekly" class="pill-btn px-3 py-1.5 rounded-full text-gray-400 hover:text-white transition">Weekly Top 10</button>
      <button data-tab="monthly" class="pill-btn px-3 py-1.5 rounded-full text-gray-400 hover:text-white transition">Monthly Top 100</button>
      <button data-tab="quarterly" class="pill-btn px-3 py-1.5 rounded-full text-gray-400 hover:text-white transition">3-Month Top 100</button>
      <button data-tab="yearly" class="pill-btn px-3 py-1.5 rounded-full text-gray-400 hover:text-white transition">Yearly Top 100</button>
      <button data-tab="top-15-artists" class="pill-btn px-3 py-1.5 rounded-full text-gray-400 hover:text-white transition">Top 15 Artists</button>
    </nav>

    <!-- 3. Active iTunes Live Button -->
    <div class="flex items-center gap-3">
      <button id="itunes-live-btn" class="px-4 py-1.5 bg-brand hover:bg-yellow-500 text-black font-semibold text-sm rounded-full transition flex items-center gap-1.5">
        <i class="fa-brands fa-apple text-base"></i>
        <span>iTunes Live</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">

    <!-- TRACKER SECTION -->
    <section>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
          <h2 id="section-title" class="text-2xl font-bold flex items-center gap-2">
            <span>All-Time Top Tracks</span>
            <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
          </h2>
          <p id="section-subtitle" class="text-xs text-gray-400 mt-1">Sourced directly from your Habesha iTunes Google Sheet</p>
        </div>

        <!-- Limit Display Selector -->
        <div class="flex items-center gap-2 bg-cardBg rounded-lg p-1 text-xs border border-gray-800">
          <span class="text-gray-400 px-2">Show:</span>
          <button data-limit="12" class="limit-btn px-3 py-1 text-gray-400 hover:text-white">12</button>
          <button data-limit="24" class="limit-btn px-3 py-1 text-gray-400 hover:text-white">24</button>
          <button data-limit="48" class="limit-btn active px-3 py-1 bg-gray-800 text-white rounded-md">48</button>
        </div>
      </div>

      <!-- LOADER SPINNER -->
      <div id="loader" class="hidden flex justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-brand border-t-transparent"></div>
      </div>

      <!-- MEDIA CARD GRID -->
      <div id="music-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        <!-- Track Cards Render Here -->
      </div>
    </section>

  </main>

  <!-- AUDIO PLAYER CONTROLLER -->
  <audio id="audio-player"></audio>

  <!-- External JavaScript Script -->
  <script src="app.js"></script>
</body>
</html>
